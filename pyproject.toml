[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacite"
version = "0.1.0"
description = "JaCite-Bench: do LLMs invent Japanese law articles?"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["transformers>=4.40", "datasets>=2.18", "huggingface-hub>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]